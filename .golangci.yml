version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - misspell
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (net.Conn).Close
        - (*net.UDPConn).Close
        - (*net.UDPConn).WriteToUDP
        - (*os.File).Close
        - (*os.File).WriteString
        - (*encoding/json.Encoder).Encode
        - (*github.com/gorilla/websocket.Conn).Close
        - (*github.com/gorilla/websocket.Conn).WriteJSON
        - (*github.com/alexef/sipvoice/internal/sip.Client).send
        - (io.Closer).Close
    gosec:
      excludes:
        - G401 # MD5 is mandated by SIP digest auth (RFC 3261)
        - G501
        - G104 # best-effort UDP writes
        - G304 # config path is user supplied by design
        - G306
        - G404 # RTP SSRC/sequence do not need crypto randomness
        - G115 # bounded conversions (payload types, DTMF durations)
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec]
formatters:
  enable:
    - gofmt
